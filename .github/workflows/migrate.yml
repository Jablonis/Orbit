name: Apply Supabase migrations

# Migrations used to need a laptop. Every one of them was a person opening a
# terminal, remembering the project ref, and running `db push` — which meant a
# merged pull request was only half applied until someone got home.
#
# This runs the same command on merge, and only on merge: a pull request never
# touches the database, so a migration is reviewed before it exists anywhere.
#
# The three secrets live in the repository's own settings and never leave it.
# Nothing here echoes them, and `supabase` is pinned rather than floating on
# whatever `latest` means on the day.

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/migrate.yml"
  # So a migration that was added before this workflow existed can still be
  # applied without an empty commit to trigger it.
  workflow_dispatch:

# One at a time. Two runs pushing migrations into the same database is the one
# way to get a half-applied schema, and a queued run is better than a race.
concurrency:
  group: supabase-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4

      # A missing secret is a setup that is not finished, not a broken build.
      # It says which one and stops, rather than failing with a login error
      # nobody can read.
      - name: Check the secrets are configured
        env:
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          missing=""
          [ -n "$ACCESS_TOKEN" ] || missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -n "$DB_PASSWORD" ] || missing="$missing SUPABASE_DB_PASSWORD"
          [ -n "$PROJECT_REF" ] || missing="$missing SUPABASE_PROJECT_REF"
          if [ -n "$missing" ]; then
            echo "::error::Set these repository secrets first:$missing"
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Link the project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      # Printed before anything is applied, so the log says what the database
      # had and what the repository has — which is the whole of the answer when
      # the two have drifted apart.
      - name: What is applied, and what is not
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase migration list --linked

      - name: Apply them
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked

      - name: What is applied now
        if: always()
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase migration list --linked
